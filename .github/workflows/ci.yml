name: Gen-hub Linux checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Backend, MCP and OAuth integration
        run: npm test
      - name: Linux installer and syntax checks
        run: npm run check
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Browser flows and list-detail tabs
        run: npm run test:ui
        env:
          UI_SCREENSHOT_DIR: test-results/monitor
      - name: Monitor screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-design-screenshots
          path: test-results/monitor
          if-no-files-found: warn
  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Actual Docker, Caddy TLS and persistent data acceptance
        run: sudo python3 tests/docker_smoke.py
