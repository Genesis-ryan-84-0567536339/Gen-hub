name: Build and Push Docker Image

permissions:
  id-token: write
  contents: read
  packages: write
  actions: read
  security-events: write

env:
  IMAGE_REPOSITORY: ghcr.io/genesis-ryan-84-0567536339/gen-hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - docs/**
      - chart/**
      - .github/workflows/**

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch tags and full commit history for branch builds.
          # This provides the VCS info required for `go build` to produce a binary that contains a
          # main module pseudo-version with a core segment relative to the most recent release tag
          # (e.g. vX.Y.(Z+1)-0.<ts>-<rev>).
          # Without the full history, branch builds generate versions like v0.0.0-<ts>-<rev>,
          # which can cause false positives in vulnerability scans.
          fetch-depth: ${{ case(github.ref_type == 'tag', 1, 0) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"
      - name: Check install!
        run: cosign version

      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          IMAGE: ${{ env.IMAGE_REPOSITORY }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Copy images to latest tag
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
        run: |
          crane tag "${IMAGE_REPOSITORY}:${{ github.ref_name }}" latest

  image-scan:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
