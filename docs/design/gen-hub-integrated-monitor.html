        root.querySelectorAll('[data-app]').forEach(b=>{b.classList.toggle('active',b.dataset.app===appPage);if(b.classList.contains('gh-nav'))b.setAttribute('aria-current',b.dataset.app===appPage?'page':'false')});
        q('#gh-content').innerHTML=appPage==='overview'?overviewScreen():appPage==='mcps'||appPage==='agents'?management(appPage):appPage==='vault'?vaultScreen():appPage==='audit'?auditScreen():appPage==='kanban'?kanbanScreen():settingsScreen();
        chat();if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});requestAnimationFrame(drawWires);
      }
      function drawWires(){
        const graph=q('#gh-graph');if(!graph)return;const svg=graph.querySelector('svg'),box=graph.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+box.width+' '+box.height);
        svg.innerHTML=links.map(l=>{const a=q('#gh-node-'+l[0]).getBoundingClientRect(),b=q('#gh-node-'+l[1]).getBoundingClientRect(),x1=a.right-box.left,y1=a.top+a.height/2-box.top,x2=b.left-box.left,y2=b.top+b.height/2-box.top,mid=(x1+x2)/2,active=selectedAgent?l[0]===selectedAgent:selectedService?l[1]===selectedService:false;return '<path class="gh-wire '+(active?'on':'')+'" style="opacity:'+((selectedAgent||selectedService)&&!active ? 0.15 : 1)+'" d="M '+x1+' '+y1+' C '+mid+' '+y1+', '+mid+' '+y2+', '+x2+' '+y2+'"></path>'}).join('');
      }
      root.addEventListener('click',function(e){
        const b=e.target.closest('button');if(!b||!root.contains(b))return;const d=b.dataset;
        if(d.chatToggle){chatOpen=!chatOpen}
        else if(d.app){appPage=d.app;selectedTool='';if(appPage==='agents')entityId='claude';if(appPage==='mcps')entityId='github';manageTab='info'}
        else if(d.monitorView){monitorView=d.monitorView;appPage='overview'}
        else if(d.resource){selectedTool='';resourceFilter=d.filter||'all';if(d.resource==='agents')chooseEntity('agents','claude');else if(d.resource==='connections')chooseEntity('mcps','github');else if(d.resource==='secrets')appPage='vault';else{appPage='overview';monitorView='resources';resourceKind='tools'}}
        else if(d.agent){selectedAgent=selectedAgent===d.agent?'':d.agent;selectedService='';appPage='overview';monitorView='overview';selectedFlow=(filteredFlows()[0]||{}).id||''}
        else if(d.service){selectedService=selectedService===d.service?'':d.service;selectedAgent='';appPage='overview';monitorView='overview';selectedFlow=(filteredFlows()[0]||{}).id||''}
        else if(d.clear){selectedAgent='';selectedService='';selectedFlow='1048'}
        else if(d.flow){selectedFlow=d.flow;detailTab='summary';appPage='audit'}
        else if(d.detailTab){detailTab=d.detailTab}
        else if(d.tool){selectedTool=d.tool}
        else if(d.closeTool){selectedTool=''}
        else if(d.manageKind){chooseEntity(d.manageKind,d.manageId,d.openTab||'info')}
        else if(d.manageTab){manageTab=d.manageTab}
        else if(d.entity){entityId=d.entity}
        else if(d.returnOverview){appPage='overview'}
        else if(d.publish){const t=toolsList.find(t=>t.id===d.publish);t.published=!t.published;services.find(s=>s.id===t.service).published=toolsList.filter(x=>x.service===t.service&&x.published).length}
        else if(d.ask){
          chatOpen=true;chatScenario=d.ask;
          if(d.ask==='github'){selectedService='github';selectedAgent='';appPage='overview';monitorView='overview';selectedFlow='1048'}
          if(d.ask==='blocked'){selectedService='';selectedAgent='';selectedFlow='1046';detailTab='rights';appPage='audit'}
          if(d.ask==='figma')chooseEntity('mcps','figma');
        }
        render();
      });
      root.addEventListener('change',function(e){
        if(e.target.id==='gh-inventory-filter'){resourceFilter=e.target.value;selectedTool='';render()}
        else if(e.target.dataset.grant){const a=agents.find(a=>a.id===entityId),list=grants[a.id],t=e.target.dataset.grant;if(e.target.checked&&!list.includes(t))list.push(t);if(!e.target.checked)grants[a.id]=list.filter(g=>g!==t);a.grants=grants[a.id].length;render()}
      });
      new ResizeObserver(()=>requestAnimationFrame(drawWires)).observe(root);
      render();
    })();
  </script>
</div>
