# Gen Hub Production Stack with Automatic HTTPS (E1)
services:
  gen-hub:
    image: ghcr.io/genesis-ryan-84-0567536339/gen-hub:latest
    container_name: gen-hub-core
    restart: unless-stopped
    environment:
      - OBOT_SERVER_HOSTNAME=https://${GEN_HUB_DOMAIN}
      - OBOT_SERVER_UI_HOSTNAME=https://${GEN_HUB_DOMAIN}
      - OBOT_SERVER_PORT=8080
      - POSTGRES_USER=obot
      - POSTGRES_PASSWORD=${GEN_HUB_DB_PASSWORD:-obot_secure_pass}
      - POSTGRES_DB=obot
    volumes:
      - gen_hub_data:/data
    networks:
      - gen-hub-net

  caddy-proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: gen-hub-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GEN_HUB_DOMAIN=${GEN_HUB_DOMAIN}
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gen-hub
    networks:
      - gen-hub-net

volumes:
  gen_hub_data:
  caddy_data:
  caddy_config:

networks:
  gen-hub-net:
    driver: bridge
