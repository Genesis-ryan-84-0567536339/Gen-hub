# Gen Hub Production Stack with Native Container Runtime & Automatic HTTPS (E1)
services:
  gen-hub:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: gen-hub-core
    restart: unless-stopped
    environment:
      - OBOT_SERVER_HOSTNAME=https://${GEN_HUB_DOMAIN}
      - OBOT_SERVER_UI_HOSTNAME=https://${GEN_HUB_DOMAIN}
      - OBOT_SERVER_PORT=8080
      - POSTGRES_USER=${GEN_HUB_DB_USER:-obot}
      - POSTGRES_PASSWORD=${GEN_HUB_DB_PASSWORD:?Database password must be provided}
      - POSTGRES_DB=${GEN_HUB_DB_NAME:-obot}
    volumes:
      - gen_hub_data:/data
    networks:
      - gen-hub-net

  caddy-proxy:
    image: docker.io/library/caddy:2-alpine
    container_name: gen-hub-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GEN_HUB_DOMAIN=${GEN_HUB_DOMAIN:?Public domain must be provided}
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gen-hub
    networks:
      - gen-hub-net

volumes:
  gen_hub_data:
  caddy_data:
  caddy_config:

networks:
  gen-hub-net:
    driver: bridge
